name: Full Benchmark Comparison

on:
  push:
    branches: [pure-go-race]
    paths:
      - 'src/runtime/race/**'
      - 'src/runtime/race*.go'
      - 'src/runtime/race*.s'
      - 'src/runtime/atomic_pointer*.go'
      - 'src/runtime/proc.go'
      - 'src/runtime/runtime2.go'
      - 'src/runtime/time.go'
      - 'src/internal/race/**'
      - 'src/sync/atomic/race*.s'
      - 'src/sync/atomic/type.go'
      - 'src/sync/atomic/pointer_load*.go'
      - 'src/cmd/compile/internal/base/flag.go'
      - 'src/cmd/compile/internal/gc/main.go'
      - 'src/cmd/compile/internal/inline/inl.go'
      - 'src/cmd/compile/internal/ir/symtab.go'
      - 'src/cmd/compile/internal/noder/import.go'
      - 'src/cmd/compile/internal/ssa/config.go'
      - 'src/cmd/compile/internal/ssa/rewrite.go'
      - 'src/cmd/compile/internal/ssa/rewritegeneric.go'
      - 'src/cmd/compile/internal/ssagen/intrinsics.go'
      - 'src/cmd/compile/internal/ssagen/ssa.go'
      - 'src/cmd/compile/internal/typecheck/_builtin/runtime.go'
      - 'src/cmd/compile/internal/typecheck/builtin.go'
      - 'src/cmd/compile/internal/types/type.go'
      - 'src/cmd/compile/internal/walk/compare.go'
      - 'src/cmd/compile/internal/walk/order.go'
      - 'src/cmd/compile/internal/walk/select.go'
      - 'src/cmd/internal/goobj/builtinlist.go'
      - 'src/cmd/internal/objabi/pkgspecial.go'
      - 'src/cmd/dist/test.go'
      - 'src/cmd/go/internal/load/pkg.go'
      - 'src/cmd/go/testdata/script/*race*'
      - 'VERSION'
      - 'go.env'
      - 'benchmarks/**'
      - '.github/workflows/full-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Baseline vs TSAN vs PureGo
    runs-on: ubuntu-latest
    # Each 60-minute soak runs PureGo and TSAN sequentially to avoid
    # cross-backend resource interference. Stable + churn therefore require
    # at least four hours before build and comparison overhead.
    timeout-minutes: 360

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize evidence status
        run: |
          mkdir -p benchmarks/results
          echo RUNNING > benchmarks/results/status.txt

      - name: Set up pinned bootstrap Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Test benchmark evidence validation
        run: |
          bash benchmarks/scripts/test_run_comparison.sh
          bash benchmarks/scripts/test_run_soak.sh

      - name: Install pinned benchmark tools
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y gcc time

      - name: Build this fork's toolchain
        run: |
          [[ "$(git rev-parse --verify HEAD)" == "$GITHUB_SHA" ]]
          GOROOT_BOOTSTRAP="$(go env GOROOT)" \
            bash benchmarks/run_comparison.sh --build-toolchain bin/go

      - name: Run gated same-host comparison
        working-directory: benchmarks
        run: |
          bash ./run_comparison.sh \
            --go ../bin/go \
            --count 10 \
            --benchtime 1s \
            --max-raceread-ratio 1.00

      - name: Publish validated summary
        run: |
          [[ "$(cat benchmarks/results/status.txt)" == PASS ]]
          grep -F 'fork go tool nm check: __tsan symbols present' benchmarks/results/symbols-tsan.txt
          grep -F 'fork go tool nm check: no __tsan or runtime/cgo symbols' benchmarks/results/symbols-purego.txt
          bash benchmarks/run_comparison.sh \
            --validate-release-contract benchmarks/results/release-contract.txt
          cat benchmarks/results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run stable 60-minute soak
        run: |
          bash benchmarks/scripts/run_soak.sh \
            --go ./bin/go --mode stable --duration 60m \
            --out benchmarks/results/soak-stable

      - name: Run churn 60-minute soak
        run: |
          bash benchmarks/scripts/run_soak.sh \
            --go ./bin/go --mode churn --duration 60m \
            --out benchmarks/results/soak-churn

      - name: Publish soak summaries
        run: |
          cat benchmarks/results/soak-stable/summary.txt >> "$GITHUB_STEP_SUMMARY"
          cat benchmarks/results/soak-churn/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Mark incomplete evidence failed
        if: failure()
        run: |
          mkdir -p benchmarks/results
          echo FAIL > benchmarks/results/status.txt

      - name: Upload success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmarks/results/status.txt
            benchmarks/results/release-contract.txt
            benchmarks/results/environment.txt
            benchmarks/results/source-status.txt
            benchmarks/results/backend-identity.txt
            benchmarks/results/raw/**
            benchmarks/results/baseline.txt
            benchmarks/results/tsan.txt
            benchmarks/results/purego.txt
            benchmarks/results/*.samples
            benchmarks/results/raceread-*.txt
            benchmarks/results/matrix-*
            benchmarks/results/raceread_ratio.txt
            benchmarks/results/sample-order.txt
            benchmarks/results/benchstat_tsan_vs_purego.txt
            benchmarks/results/benchstat_all.txt
            benchmarks/results/memory_rss.txt
            benchmarks/results/rss-*.stdout
            benchmarks/results/rss-*.time
            benchmarks/results/symbols-*.txt
            benchmarks/results/summary.md
            benchmarks/results/soak-stable/**
            benchmarks/results/soak-churn/**
            bin/go.benchmark-attestation
          if-no-files-found: warn
          retention-days: 90
